version: "3.8"

services:
  internal-file-api:
    image: 581145854871.dkr.ecr.ap-southeast-2.amazonaws.com/internal-file-api:latest
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 2
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        order: start-first
